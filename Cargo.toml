[package]
name = "riff-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "A lightweight native Rust music client for YouTube"

[dependencies]
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
directories = "6"
base64 = "0.23"
getrandom = "0.4"
sha2 = "0.10"
url = "2"
webbrowser = "1"
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "accesskit", "default_fonts", "x11", "wayland"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
egui-winit = { version = "0.36.2", default-features = false, features = ["accesskit", "clipboard", "links"] }
accesskit_winit = "0.32.2"
raw-window-handle = "0.6.2"
raw-window-metal = "1.1.0"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-metal = "0.3"
objc2-quartz-core = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Pipes", "Win32_Foundation", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# Isolated fixtures and native screenshot capture for visual QA. Never enabled by default.
ui-qa = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
